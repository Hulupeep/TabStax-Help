name: Truth gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Checker self-test
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Ledger page is in sync
        run: python3 scripts/render_ledger.py --check
      - name: Changed pages pass the gate
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_truth.py --changed origin/${{ github.base_ref }}
      - name: Changed pages pass the voice check
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_voice.py --changed origin/${{ github.base_ref }}
      - name: Whole site report
        run: |
          python3 scripts/check_truth.py
          python3 scripts/check_voice.py
