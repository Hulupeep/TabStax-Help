# Shipped ledger: the source of truth for what help pages may describe as live.
#
# States
#   shipped     Seen working in production by a person in a browser. Pages may describe it as live.
#   live        Observed in production from outside (endpoint, live MCP tool list, public listing),
#               not yet browser-verified. Pages may describe it; the checker warns until verified.
#   unverified  Code or data says it exists; nobody has observed it in production. Checker warns.
#   partial     Some of it is in production, or code is merged but production activation is pending.
#               Pages need the Partial badge.
#   planned     Not in production. Pages need the Planned badge and future tense.
#
# Fields
#   terms   case-insensitive regexes. A page that matches one is "naming" the capability.
#   avoid   regexes that must never appear on a page (old URLs, retired names).
#   wording the phrase pages should use.
#
# Edit this file, then run: python3 scripts/render_ledger.py

