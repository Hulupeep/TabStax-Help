# HeyStax Help - GitHub Pages Configuration

title: HeyStax Help
description: Help center for HeyStax — your workspace for momentum

# Build settings
markdown: kramdown

# Just the Docs theme
remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme

# Aux links in the top-right
aux_links:
  "Get HeyStax":
    - "https://heystax.ai"

# Heading anchor links on hover
heading_anchors: true

# Footer content
footer_content: "HeyStax Help &copy; Hulupeep"

# Color scheme
color_scheme: tabstax

# Search
search_enabled: true

# Navigation order / grouping
# Pages declare their own nav_order and parent in front matter

# Exclude files we don't want published
exclude:
  - scripts/
  - valueprop.md
  - CLAUDE.md
