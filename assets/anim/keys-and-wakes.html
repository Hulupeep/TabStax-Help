<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column. Animated scene player first (keys, Chief, roles, workers, wakes, events), then the reference tables. Same palette as v1. */
:root{--bg:#f7f6f2;--fg:#1d2026;--muted:#5e6572;--line:#d9d6cd;--surface:#fff;--owner:#b7791f;--agent:#c2562e;--worker:#2f6fbf;--hook:#0f7b80;--plan:#6b4fbb;--ok:#1f7a4d;--bad:#b83a2e;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151b;--fg:#e7eaf0;--muted:#97a0ae;--line:#2b313c;--surface:#191d25;--owner:#f2b640;--agent:#e58a62;--worker:#5aa2f2;--hook:#4cc3c8;--plan:#b49cf5;--ok:#58c48d;--bad:#f07a6c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151b;--fg:#e7eaf0;--muted:#97a0ae;--line:#2b313c;--surface:#191d25;--owner:#f2b640;--agent:#e58a62;--worker:#5aa2f2;--hook:#4cc3c8;--plan:#b49cf5;--ok:#58c48d;--bad:#f07a6c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2px 2px}

p{margin:0;max-width:72ch}
.lede{color:var(--muted);margin-top:6px}
code{font:14px var(--mono)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}

ul,ol{margin:0;padding-left:22px;max-width:78ch}li{margin:6px 0}

/* player */

.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-bottom:1px solid var(--line)}
.tabs button{font:600 13px var(--sans);background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}

  {t:4.2,a:'li',b:'bd',l:'run_start · claim',k:'worker'},{t:5.3,a:'li',b:'cx',l:'start on card',k:'worker'},{t:6.4,chip:'cx',s:'working'},

 steps:[[0,'heystax listen runs in a connected folder with that folder\'s worker key.'],[.3,'It calls wait_for_work and holds the line open. Outbound only, no open ports.'],[3,'A card arrives. It starts a run and claims the card.'],[5.3,'It starts claude or codex on the card in its own git worktree, on its own branch. The folder you work in is never touched.'],[7.6,'When it finishes, it reports and ends the run.'],[9.8,'Pushed work: the worktree is removed. Unpushed work is kept, never thrown away.']]},

  {id:'ev',c:2,r:1,t:'Events',s:'agent_events_list',k:'neutral'},{id:'ch',c:4,r:1,t:'@chief-of-staff',s:'idle',k:'agent'}],

  {t:5.6,chip:'n',s:'nobody home'},{t:5.7,a:'n',b:'ev',l:'no_one_home',k:'bad'},{t:6.8,a:'ev',b:'ch',l:'no_one_home',k:'agent'},{t:7.9,chip:'ch',s:'reroutes or flags you'}],
 steps:[[0,'run_ended: a worker finished. The Chief checks the report and files the next card.'],[2.9,'queue_empty: a role ran out of work. The Chief feeds it from the goal.'],[5.6,'no_one_home: a card waits on a role with no live worker. The Chief reroutes it or flags it.'],[7.9,'The board shows live, missed or nobody home per role. You can pause a role or cap its runs per hour.']]},

 steps:[[0,'Only irreversible work waits. Everything else runs without asking.'],[2.4,'The Chief can give the go-ahead on work someone else proposed.'],[5,'It can never approve its own proposal, or work assigned to it.'],[6.6,'You can always give it with your PAT.']]},
{id:'connect',tab:'8 · heystax connect',title:'One-step setup for any CLI',tag:['review','live, install from the repo'],
 nodes:[{id:'you',c:0,r:1,t:'You',s:'paste a key once',k:'owner'},{id:'cn',c:2,r:1,t:'heystax connect',s:'in this folder',k:'worker'},
  {id:'tk',c:4,r:0,t:'worker.token',s:'one per folder, 0600',k:'worker'},{id:'ag',c:4,r:2,t:'Standing order',s:'plugin or AGENTS.md',k:'worker'}],
 beats:[{t:.3,a:'you',b:'cn',l:'PAT, role or worker key',k:'owner'},{t:1.4,chip:'cn',s:'which stax?\nwhich role?'},{t:2.6,a:'cn',b:'tk',l:'tsw_live_',k:'worker'},
  {t:3.7,chip:'cn',s:'pasted key not saved'},{t:4,a:'cn',b:'ag',l:'tell HeyStax',k:'worker'},{t:5.6,chip:'ag',s:'heystax task start\nnote · done'},{t:7.2,chip:'tk',s:'listen --install'}],
 steps:[[0,'In a folder, heystax connect asks for a key once: your PAT, a role key or a worker key.'],[1.4,'It asks which stax, and which role only if there are several.'],[2.6,'It saves a worker key for this folder. Another folder on the same machine can be another role. The key you pasted is not kept.'],[4,'It writes the standing order: whatever you do, tell HeyStax. Claude Code gets it from the HeyStax plugin, Codex from AGENTS.md.'],[5.6,'heystax task start puts self-started work on the board. note adds branch and PR. done closes it.'],[7.2,'heystax listen --install keeps that folder\'s worker running in the background.']]}
];
const NS='http://www.w3.org/2000/svg',sv=document.getElementById('sv');
const mq=matchMedia('(max-width: 640px)');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur=0,t0=performance.now(),paused=false,pauseAt=0,auto=true;
const NW=170,NH=64;
function pos(n){return mq.matches?{x:n.r*190,y:n.c*100}:{x:n.c*175,y:n.r*112};}
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
function col(k){return `var(--${k==='neutral'?'muted':k})`;}
function dur(s){let m=0;for(const b of s.beats)m=Math.max(m,b.t+(b.a?1.2:0));return m+2.2;}
let G={};
function build(){
  const s=SC[cur];const ps=s.nodes.map(pos),xs=ps.map(p=>p.x),ys=ps.map(p=>p.y);let x0=Math.min(...xs)-NW/2-12,vw=Math.max(...xs)+NW/2+12-x0;const minW=mq.matches?420:700;if(vw<minW){x0-=(minW-vw)/2;vw=minW;}const y0=Math.min(...ys)-NH/2-40;
  sv.setAttribute('viewBox',`${x0} ${y0} ${vw} ${Math.max(...ys)+NH/2+16-y0}`);sv.innerHTML='';
  const N={};s.nodes.forEach(n=>N[n.id]=n);
  const eg=el('g',{},sv),seen={};
  s.beats.forEach(b=>{if(!b.a)return;const k=[b.a,b.b].sort().join();if(seen[k])return;seen[k]=1;const A=pos(N[b.a]),B=pos(N[b.b]);el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,class:'edge'},eg);});
  G.nodes={};
  s.nodes.forEach(n=>{const p=pos(n),g=el('g',{class:'node'},sv);
    const r=el('rect',{x:p.x-NW/2,y:p.y-NH/2,width:NW,height:NH,rx:10,style:`stroke:${col(n.k)}`},g);
    if(n.k==='plan')r.setAttribute('stroke-dasharray','6 4');
    const t=el('text',{x:p.x,y:p.y-8,'text-anchor':'middle',class:'t'},g);t.textContent=n.t;
    const s1=el('text',{x:p.x,y:p.y+11,'text-anchor':'middle',class:'s'},g),s2=el('text',{x:p.x,y:p.y+26,'text-anchor':'middle',class:'s'},g);
    G.nodes[n.id]={n,r,s1,s2,last:null};});
  G.pk=s.beats.filter(b=>b.a).map(b=>{const g=el('g',{class:'pk',opacity:0},sv);const tw=b.l.length*7.4+18;
    el('rect',{x:-tw/2,y:-12,width:tw,height:24,rx:12,style:`fill:${col(b.k||'owner')}`},g);
    const tx=el('text',{x:0,y:4,'text-anchor':'middle'},g);tx.textContent=b.l;if(!b.k)g.querySelector('rect').style.fill='var(--fg)',tx.style.fill='var(--bg)';
    return {b,g,A:pos(N[b.a]),B:pos(N[b.b])};});
  document.getElementById('st').textContent=s.title;
  const sg=document.getElementById('sg');sg.textContent=s.tag[1];sg.className='tag '+s.tag[0];
  const ol=document.getElementById('steps');ol.innerHTML='';G.steps=s.steps.map(([a,txt])=>{const li=document.createElement('li');li.textContent=txt;ol.appendChild(li);return {a,li};});
  document.querySelectorAll('#tabs button').forEach((b,i)=>b.setAttribute('aria-selected',i===cur));
  G.dur=dur(s);
}
function ease(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;}
function render(t){
  const s=SC[cur];
  for(const id in G.nodes){const o=G.nodes[id];let sub=o.n.s;for(const b of s.beats)if(b.chip===id&&t>=b.t)sub=b.s;
    if(sub!==o.last){const [l1,l2]=(sub||'').split('\n');o.s1.textContent=l1||'';o.s2.textContent=l2||'';o.s1.setAttribute('y',l2?pos(o.n).y+11:pos(o.n).y+16);o.last=sub;
      o.s1.style.fill=/revoked|nobody|refused|no 2xx/.test(sub)?'var(--bad)':'';}
    let hit=false;for(const p of G.pk){const e=p.b.t+1.2;if(p.b.b===id&&!p.b.bounce&&t>=e&&t<e+.6)hit=true;}
    o.r.setAttribute('stroke-width',hit?4:2);}
  for(const p of G.pk){const d=t-p.b.t;if(d<0||d>1.6){p.g.setAttribute('opacity',0);continue;}
    let u=Math.min(d/1.2,1);if(p.b.bounce)u=u<.55?u/.55*.6:(1-(u-.55)/.45)*.6;u=ease(Math.max(0,u));
    const x=p.A.x+(p.B.x-p.A.x)*u,y=p.A.y+(p.B.y-p.A.y)*u-(p.A.y===p.B.y?0:0);
    p.g.setAttribute('transform',`translate(${x},${y-(p.A.y===p.B.y?22:0)})`);p.g.setAttribute('opacity',d>1.2?Math.max(0,1-(d-1.2)/.4):Math.min(1,d/.15));}
  let k=-1;G.steps.forEach((st,i)=>{if(t>=st.a)k=i;});
  G.steps.forEach((st,i)=>{st.li.className=i===k?'now':i<k?'done':'';});
  document.getElementById('pb').style.width=Math.min(100,t/G.dur*100)+'%';
}
function go(i){cur=(i+SC.length)%SC.length;build();t0=performance.now();if(paused)pauseAt=0;render(reduce?G.dur:0);try{history.replaceState(null,'','#'+SC[cur].id);}catch(e){}}
function tick(now){if(!paused){const t=(now-t0)/1000;if(t>G.dur){if(auto)go(cur+1);else t0=now;}else render(t);}requestAnimationFrame(tick);}
const tabs=document.getElementById('tabs');
SC.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.role='tab';b.textContent=s.tab;b.onclick=()=>{go(i);};tabs.appendChild(b);});
const pp=document.getElementById('pp');
pp.onclick=()=>{if(paused){paused=false;t0=performance.now()-pauseAt*1000;pp.textContent='Pause';}else{paused=true;pauseAt=(performance.now()-t0)/1000;pp.textContent='Play';}};
document.getElementById('rs').onclick=()=>{go(cur);if(paused)pp.click();};
mq.addEventListener('change',()=>{build();});
const h=location.hash.slice(1),hi=SC.findIndex(s=>s.id===h);
go(hi>=0?hi:0);
window.__renderAt=(id,t)=>{const i=SC.findIndex(s=>s.id===id);paused=true;cur=i;build();render(t);};
if(reduce){paused=true;pp.textContent='Play';render(G.dur);}
requestAnimationFrame(tick);
})();
</script>
<script>
(()=>{function post(){try{parent.postMessage({hsKeysHeight:document.documentElement.scrollHeight},'*');}catch(e){}}
new ResizeObserver(post).observe(document.body);addEventListener('load',post);})();
</script>
